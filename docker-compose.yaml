name: sqlflow-python-examples

services:
  postgres-signaling:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: sqlflow-postgres-signaling
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sqlflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_signaling_data:/var/lib/postgresql/data
      - ./sql/ssf-postgres-minimal.sql:/docker-entrypoint-initdb.d/10-ssf-postgres-minimal.sql:ro
      - ./sql/ssf-postgres-signaling.sql:/docker-entrypoint-initdb.d/20-ssf-postgres-signaling.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlflow_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres-nats:
    image: postgres:16-alpine
    profiles: ["postgres-nats"]
    container_name: sqlflow-postgres-nats
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sqlflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_nats_data:/var/lib/postgresql/data
      - ./sql/ssf-postgres-minimal.sql:/docker-entrypoint-initdb.d/10-ssf-postgres-minimal.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlflow_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    profiles: ["postgres-nats"]
    container_name: sqlflow-nats
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8222/healthz
          | grep -q '"status":"ok"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_signaling_data:
  postgres_nats_data:
  nats_data:
