services:
  db:
    container_name: postgres_db
    image: postgres:18
    environment:
      POSTGRES_DB: sqlflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - "../sql/ssf-postgres.sql:/docker-entrypoint-initdb.d/ssf-postgres.sql"