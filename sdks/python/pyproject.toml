[tool.poetry]
name = "sqlflow-sdk"
version = "0.1.0"
description = "Python SDK for the SqlFlow durable execution framework."
authors = ["Your Name you@example.com"]
readme = "README.md"
package-mode = false
packages = [{include = "sqlflow"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pydantic = "^2.0.0"
asyncpg = {version = "^0.29.0", optional = true}
aioodbc = {version = "^0.4.0", optional = true}
fastapi = "^0.141.1"
uvicorn = "^0.52.4"

[tool.poetry.extras]
postgres = ["asyncpg"]
sqlserver = ["aioodbc"]
all = ["asyncpg", "aioodbc"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"