[project]
name = "sqlflow-sdk"
version = "0.1.0"
description = "Python SDK for the SqlFlow durable execution framework."
readme = "README.md"
requires-python = ">=3.10,<4.0"

authors = [
    { name = "Philipp Wagner", email = "philipp@bytefish.de" }
]

dependencies = [
    "pydantic>=2.0.0,<3.0.0"
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0,<0.30.0"]
sqlserver = ["aioodbc>=0.4.0,<0.5.0"]
all = [
    "asyncpg>=0.29.0,<0.30.0",
    "aioodbc>=0.4.0,<0.5.0"
]

[tool.poetry]
packages = [
    { include = "sqlflow" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"